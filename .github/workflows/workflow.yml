name: publish

# Publishes boundary-envelope to PyPI via Trusted Publishing (OIDC) — no token.
# PyPI matches the trusted publisher on this file's name (workflow.yml), the repo
# (mavaali/boundary), and the id-token permission below. Triggered by pushing a
# release tag (e.g. `git tag v0.12.0 && git push origin v0.12.0`), or manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # REQUIRED: lets the job mint the OIDC token PyPI trusts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate the publish on a green build — never ship a broken tag.
      - name: Install + test
        run: |
          python -m pip install --upgrade pip build
          pip install -e . pytest
          pytest -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
